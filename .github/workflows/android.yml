name: Android APK

# Dispara sob demanda (workflow_dispatch) ou em push para branches de trabalho.
# O APK e assinado com uma chave de debug: serve para testar no aparelho, nao
# para publicar na Play Store.

on:
  workflow_dispatch:
  push:
    branches:
      - "kilo/**"
    paths:
      - "export_presets.cfg"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build tools e platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Godot 4.4.1 e templates
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p /opt/godot "$DEST"
          curl -sSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.4.1-stable_linux.x86_64
          ln -sf /opt/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/tpzx && mkdir -p /tmp/tpzx
          unzip -qo /tmp/templates.tpz -d /tmp/tpzx
          cp -a /tmp/tpzx/templates/. "$DEST/"
          test -f "$DEST/android_debug.apk"

      - name: Chave de debug e ajustes do editor
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          {
            printf '[gd_resource type="EditorSettings" load_steps=2 format=3]\n\n[resource]\n'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/debug_keystore = "%s/.local/share/godot/keystores/debug.keystore"\n' "$HOME"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } > "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Exportar APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path "${{ github.workspace }}" --import
          godot --headless --path "${{ github.workspace }}" --export-debug "Android" "${{ github.workspace }}/build/android/Faroleiro.apk"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: faroleiro-apk
          path: build/android/Faroleiro.apk
          if-no-files-found: error
          retention-days: 30