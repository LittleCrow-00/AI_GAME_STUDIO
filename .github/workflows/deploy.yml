name: Build and Deploy Godot Web
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Criar pasta de saida
        run: mkdir -v -p build/web
      - name: Exportar jogo Godot
        run: godot --headless --verbose --export-release "Web"
      - name: Preparar para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no ar
        id: deployment
        uses: actions/deploy-pages@v4
